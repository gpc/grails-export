// WARNING: Do not edit this file directly in your own repository.
// It is maintained in the grails-plugin-template repository.
// https://github.com/grails-plugins/grails-plugin-template/tree/main/conventions
plugins {
    id 'checkstyle'
    id 'codenarc'
}

// The rule sets ship inside the conventions plugin. They are extracted into each project's build directory so
// that Checkstyle (which needs a config directory) and CodeNarc (which needs a file) can read them.
def codeStyleConfigDir = layout.buildDirectory.dir('code-style-config')
def checkstyleConfigDir = codeStyleConfigDir.map { it.dir('checkstyle') }
def codenarcConfigFile = codeStyleConfigDir.map { it.file('codenarc/codenarc.groovy') }

def codeStyleResources = [
        'checkstyle/checkstyle.xml',
        'checkstyle/checkstyle-suppressions.xml',
        'codenarc/codenarc.groovy',
]

def extractCodeStyleConfig = tasks.register('extractCodeStyleConfig') {
    description = 'Extracts the bundled Checkstyle and CodeNarc configuration'
    def outputDir = codeStyleConfigDir
    def loader = getClass().classLoader
    inputs.property('resources', codeStyleResources)
    outputs.dir(outputDir)
    doLast {
        codeStyleResources.each { name ->
            def target = outputDir.get().file(name).asFile
            target.parentFile.mkdirs()
            loader.getResourceAsStream("code-style/${name}").withCloseable { target.bytes = it.bytes }
        }
    }
}

// Tool versions can be overridden with the checkstyleVersion / codenarcVersion project properties
extensions.configure(CheckstyleExtension) {
    it.toolVersion = (findProperty('checkstyleVersion') ?: '10.21.4') as String
    it.configDirectory = checkstyleConfigDir
    it.maxWarnings = 0
    it.showViolations = true
    it.ignoreFailures = false
}

tasks.withType(Checkstyle).configureEach {
    group = 'verification'
    dependsOn(extractCodeStyleConfig)
    onlyIf { !project.hasProperty('skipCodeStyle') }
}

extensions.configure(CodeNarcExtension) {
    it.toolVersion = (findProperty('codenarcVersion') ?: '3.6.0') as String
    it.configFile = codenarcConfigFile.get().asFile
    it.maxPriority1Violations = 0
    it.maxPriority2Violations = 0
    it.maxPriority3Violations = 0
}

tasks.withType(CodeNarc).configureEach {
    group = 'verification'
    dependsOn(extractCodeStyleConfig)
    onlyIf { !project.hasProperty('skipCodeStyle') }
}

tasks.register('codeStyle') {
    group = 'verification'
    description = 'Runs all code style checks (Checkstyle + CodeNarc).'
    dependsOn(tasks.withType(Checkstyle))
    dependsOn(tasks.withType(CodeNarc))
}
