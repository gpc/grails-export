plugins {
    id 'config.compile'
    id 'config.grails-plugin'
    id 'config.publish'
    id 'config.testing'
}

// grails-plugin-conventions' config.compile turns invokedynamic off. Groovy 6 cannot generate classic call sites
// without the optional groovy-callsite module (GROOVY-11158), and a plugin compiled with them does not load on
// Grails 9: Groovy 6 has no CallSiteArray, so the plugin class fails to instantiate and Grails skips it.
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = true
}

version = projectVersion
group = projectGroup

dependencies {
    profile 'org.apache.grails.profiles:web-plugin'
    console 'org.apache.grails:grails-console'

    compileOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    compileOnly 'org.apache.grails:grails-dependencies-starter-web'

    testImplementation platform("org.apache.grails:grails-bom:$grailsVersion")
    testImplementation 'org.apache.grails:grails-dependencies-starter-web'
    testImplementation 'org.apache.grails:grails-dependencies-test'

    // export plugin specific dependencies
    api 'com.opencsv:opencsv:5.12.0'

    api 'com.github.librepdf:openpdf:3.0.5'
    api 'com.github.librepdf:openrtf:3.0.0'
    runtimeOnly 'xerces:xercesImpl:2.12.2'

    api 'org.odftoolkit:odfdom-java:0.13.0'
    api 'org.apache.poi:poi:6.0.0'
    api 'org.apache.poi:poi-ooxml:6.0.0'

    api 'commons-beanutils:commons-beanutils:1.11.0'
    api 'commons-codec:commons-codec:1.23.0'
}
